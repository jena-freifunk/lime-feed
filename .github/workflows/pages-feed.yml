name: pages-feed

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-feed
  cancel-in-progress: true

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gzip meson ninja-build pkg-config \
            zlib1g-dev libssl-dev libzstd-dev lua5.4-dev fakeroot

      - name: Build apk-tools v3
        run: |
          # GitLab often returns 418 to GitHub-hosted runners; use the GitHub mirror.
          git clone --depth 1 --branch v3.0.8 https://github.com/alpinelinux/apk-tools.git "$HOME/apk-tools"
          meson setup "$HOME/apk-tools/build" "$HOME/apk-tools" -Ddocs=disabled -Dhelp=disabled
          ninja -C "$HOME/apk-tools/build" src/apk
          echo "$HOME/apk-tools/build/src" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/apk-tools/build/src" >> "$GITHUB_ENV"
          echo "APK_LIBDIR=$HOME/apk-tools/build/src" >> "$GITHUB_ENV"

      - name: Install feed signing key
        env:
          FFJ_FEED_PRIV: ${{ secrets.FFJ_FEED_PRIV }}
        run: |
          if [ -z "${FFJ_FEED_PRIV:-}" ]; then
            echo "No FFJ_FEED_PRIV secret — publishing unsigned feed"
            exit 0
          fi
          install -d -m 700 keys
          printf '%s\n' "$FFJ_FEED_PRIV" > keys/feed.pem
          chmod 600 keys/feed.pem
          openssl ec -in keys/feed.pem -noout
          echo "FFJ_FEED_KEY=$PWD/keys/feed.pem" >> "$GITHUB_ENV"

      - name: Build feed
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-feed.sh dist/feed

      - name: Verify feed signatures
        run: |
          if [ -z "${FFJ_FEED_KEY:-}" ]; then
            echo "Unsigned feed — nothing to verify"
            exit 0
          fi
          # apk trusts every file in --keys-dir, so expose the public key alone.
          keys_dir="$(mktemp -d)"
          openssl ec -in "$FFJ_FEED_KEY" -pubout -out "$keys_dir/feed.pub.pem"
          apk --keys-dir "$keys_dir" verify dist/feed/packages.adb dist/feed/*.apk

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/feed

  deploy:
    needs: build-feed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
